<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Piano Roll（嵌套表格布局）</title>
    <style>
      :root {
        --bg: #0f1220;
        --panel: #161b2f;
        --axis-bg: #13182a;
        --line: #2a3255;
        --line-strong: #4f5ea0;
        --text: #e7ebff;

        --axis-left: 78px;
        --note-cell-min-width: 48px;
        --axis-cell-min-width: 192px;
        --row-height: 22px;
        --whole-head-h: 24px;
        --quarter-head-h: 18px;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      body {
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }

      .title {
        margin: 0;
        padding: 12px 16px;
        font-size: 16px;
        border-bottom: 1px solid var(--line);
      }

      #layoutWrap {
        flex: 1;
        min-height: 0;
        padding: 0;
        overflow: hidden;
        position: relative;
      }

      table.outer {
        border-collapse: collapse;
        width: 100%;
        height: 100%;
        max-height: 100%;
        table-layout: fixed;
        position: absolute;
        inset: 0;
      }

      .outer td {
        border: 1px solid var(--line-strong);
        padding: 0;
        vertical-align: top;
      }
      tr.topRow {
        height: calc(var(--whole-head-h) + var(--quarter-head-h));
      }

      tr.mainRow {
        height: calc(100% - (var(--whole-head-h) + var(--quarter-head-h)));
      }

      tr.mainRow > td {
        position: relative;
      }

      td.cornerCell {
        width: var(--axis-left);
        background: var(--axis-bg);
        text-align: center;
        font-size: 12px;
        font-weight: 600;
      }

      .cornerInner {
        height: calc(var(--whole-head-h) + var(--quarter-head-h));
        display: flex;
        align-items: center;
        justify-content: center;
      }

      td.xAxisCell,
      td.yAxisCell,
      td.noteCell {
        background: var(--axis-bg);
        overflow: hidden;
      }

      #xAxisViewport,
      #yAxisViewport {
        overflow: hidden;
        position: relative;
      }

      #xAxisViewport {
        height: calc(var(--whole-head-h) + var(--quarter-head-h));
      }

      #yAxisViewport {
        width: 100%;
        height: 100%;
        position: absolute;
        inset: 0;
      }

      #xAxisTrack,
      #yAxisTrack {
        will-change: transform;
      }

      table.axisX,
      table.axisY,
      table.grid {
        border-collapse: collapse;
        table-layout: fixed;
        width: max-content;
      }

      table.axisX th,
      table.axisY th,
      table.grid td {
        border: 1px solid var(--line);
        padding: 0;
      }

      table.axisX th {
        width: var(--note-cell-min-width);
        min-width: var(--note-cell-min-width);
        color: #c9d1ff;
        font-size: 11px;
        font-weight: 500;
        background: var(--axis-bg);
      }

      .wholeHead {
        min-width: var(--axis-cell-min-width);
        height: var(--whole-head-h);
        border-bottom-color: var(--line-strong) !important;
        text-align: left;
        padding-left: 2px !important;
      }

      .quarterHead {
        height: var(--quarter-head-h);
      }

      .wholeStart {
        border-left-color: var(--line-strong) !important;
      }

      table.axisY th {
        width: var(--axis-left);
        height: var(--row-height);
        text-align: right;
        padding-right: 8px !important;
        font-size: 11px;
        color: #c9d1ff;
        background: var(--axis-bg);
      }

      #notesViewport {
        width: 100%;
        height: 100%;
        overflow: auto;
        background: var(--panel);
        position: absolute;
        inset: 0;
      }

      #notesContent {
        position: relative;
      }

      table.grid td {
        width: var(--note-cell-min-width);
        min-width: var(--note-cell-min-width);
        height: var(--row-height);
        position: relative;
        background: var(--panel);
      }

      .note {
        position: absolute;
        left: 0;
        top: 50%;
        transform: translateY(-50%);
        width: 48px;
        height: 16px;
        border-radius: 3px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: linear-gradient(
          to right,
          rgba(101, 196, 255, 0.95),
          rgba(101, 196, 255, 0.1)
        );
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <h1 class="title">Piano Roll（嵌套表格 + 轴跟随滚动）</h1>

    <div id="layoutWrap">
      <table class="outer">
        <tr class="topRow">
          <td class="cornerCell">
            <div class="cornerInner">MIDI / 时值</div>
          </td>
          <td class="xAxisCell">
            <div id="xAxisViewport">
              <div id="xAxisTrack">
                <table class="axisX" id="axisX"></table>
              </div>
            </div>
          </td>
        </tr>
        <tr class="mainRow">
          <td class="yAxisCell">
            <div id="yAxisViewport">
              <div id="yAxisTrack">
                <table class="axisY" id="axisY"></table>
              </div>
            </div>
          </td>
          <td class="noteCell">
            <div id="notesViewport">
              <div id="notesContent">
                <table class="grid" id="grid"></table>
              </div>
            </div>
          </td>
        </tr>
      </table>
    </div>

    <script>
      const MIDI_MIN = 21;
      const MIDI_MAX = 108;
      const MIDI_COUNT = MIDI_MAX - MIDI_MIN + 1;
      const QUARTER_COUNT = 256;
      const QUARTERS_PER_WHOLE = 4;

      const axisX = document.getElementById("axisX");
      const axisY = document.getElementById("axisY");
      const grid = document.getElementById("grid");
      const xAxisTrack = document.getElementById("xAxisTrack");
      const yAxisTrack = document.getElementById("yAxisTrack");
      const notesViewport = document.getElementById("notesViewport");

      // 横轴（外层单元格内的嵌套表格）
      const xWholeRow = document.createElement("tr");
      for (let q = 0; q < QUARTER_COUNT; q += QUARTERS_PER_WHOLE) {
        const th = document.createElement("th");
        th.className = "wholeHead";
        th.colSpan = QUARTERS_PER_WHOLE;
        th.textContent = `全音符 ${q / QUARTERS_PER_WHOLE}`;
        xWholeRow.appendChild(th);
      }
      axisX.appendChild(xWholeRow);

      const xQuarterRow = document.createElement("tr");
      for (let q = 0; q < QUARTER_COUNT; q++) {
        const th = document.createElement("th");
        th.className = "quarterHead";
        if (q % QUARTERS_PER_WHOLE === 0) th.classList.add("wholeStart");
        th.title = `四分音符 ${q}`;
        xQuarterRow.appendChild(th);
      }
      axisX.appendChild(xQuarterRow);

      // 纵轴（外层单元格内的嵌套表格） + 音符区内层网格
      for (let i = 0; i < MIDI_COUNT; i++) {
        const midi = MIDI_MAX - i;

        const yTr = document.createElement("tr");
        const yTh = document.createElement("th");
        yTh.textContent = String(midi);
        yTr.appendChild(yTh);
        axisY.appendChild(yTr);

        const gTr = document.createElement("tr");
        for (let q = 0; q < QUARTER_COUNT; q++) {
          const td = document.createElement("td");
          td.dataset.midi = String(midi);
          td.dataset.quarter = String(q);
          if (q % QUARTERS_PER_WHOLE === 0) td.classList.add("wholeStart");
          gTr.appendChild(td);
        }
        grid.appendChild(gTr);
      }

      // 音符区监听滚动，同步横轴与纵轴，形成电子表格跟随效果
      notesViewport.addEventListener("scroll", () => {
        const { scrollLeft, scrollTop } = notesViewport;
        xAxisTrack.style.transform = `translateX(${-scrollLeft}px)`;
        yAxisTrack.style.transform = `translateY(${-scrollTop}px)`;
      });

      // 点击内层网格创建固定大小音符
      grid.addEventListener("click", (event) => {
        const cell = event.target.closest("td");
        if (!cell) return;

        const note = document.createElement("div");
        note.className = "note";
        cell.appendChild(note);
      });
    </script>
  </body>
</html>
