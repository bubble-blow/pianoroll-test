<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Piano Roll（表格布局）</title>
    <style>
      :root {
        --bg: #0f1220;
        --panel: #161b2f;
        --line: #2a3255;
        --line-strong: #4f5ea0;
        --text: #e7ebff;
        --axis-bg: #13182a;
      }

      * { box-sizing: border-box; }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      body {
        display: flex;
        flex-direction: column;
      }

      .title {
        margin: 0;
        padding: 12px 16px;
        font-size: 16px;
        border-bottom: 1px solid var(--line);
      }

      #viewport {
        flex: 1;
        overflow: auto;
      }

      #content {
        position: relative;
      }

      table.pianoroll {
        border-collapse: collapse;
        table-layout: fixed;
        background: var(--panel);
      }

      .pianoroll th,
      .pianoroll td {
        border: 1px solid var(--line);
        padding: 0;
      }

      .corner,
      .midi,
      .head-whole,
      .head-quarter {
        position: sticky;
        background: var(--axis-bg);
        z-index: 5;
      }

      .corner {
        left: 0;
        top: 0;
        min-width: 72px;
        width: 72px;
        text-align: center;
        font-size: 12px;
        z-index: 20;
        border-right-color: var(--line-strong) !important;
        border-bottom-color: var(--line-strong) !important;
      }

      .head-whole,
      .head-quarter {
        top: 0;
        text-align: left;
        font-size: 11px;
        color: #c9d1ff;
      }

      .head-whole {
        height: 20px;
        border-bottom-color: var(--line-strong) !important;
      }

      .head-quarter {
        height: 14px;
      }

      .head-whole strong {
        margin-left: 2px;
        font-weight: 600;
      }

      .midi {
        left: 0;
        width: 72px;
        min-width: 72px;
        text-align: right;
        padding-right: 8px !important;
        font-size: 11px;
        color: #c9d1ff;
        border-right-color: var(--line-strong) !important;
      }

      td.cell,
      th.head-quarter,
      th.head-whole {
        width: 26px;
      }

      tr.pitch-row td.cell {
        height: 22px;
        position: relative;
      }

      th.head-quarter.whole-start,
      td.cell.whole-start {
        border-left-color: var(--line-strong);
      }

      .note {
        position: absolute;
        left: 0;
        top: 50%;
        transform: translateY(-50%);
        width: 52px;
        height: 16px;
        border-radius: 3px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: linear-gradient(
          to right,
          rgba(101, 196, 255, 0.95),
          rgba(101, 196, 255, 0.1)
        );
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <h1 class="title">Piano Roll（表格布局，点击网格创建音符）</h1>
    <div id="viewport">
      <div id="content">
        <table class="pianoroll" id="pianoroll"></table>
      </div>
    </div>

    <script>
      const MIDI_MIN = 21;
      const MIDI_MAX = 108;
      const QUARTER_COUNT = 256;
      const QUARTERS_PER_WHOLE = 4;

      const table = document.getElementById("pianoroll");
      const thead = document.createElement("thead");
      const tbody = document.createElement("tbody");

      // 头部第 1 行：全音符分组
      const wholeRow = document.createElement("tr");
      const corner = document.createElement("th");
      corner.className = "corner";
      corner.rowSpan = 2;
      corner.textContent = "MIDI / 时值";
      wholeRow.appendChild(corner);

      for (let q = 0; q < QUARTER_COUNT; q += QUARTERS_PER_WHOLE) {
        const whole = document.createElement("th");
        whole.className = "head-whole";
        whole.colSpan = QUARTERS_PER_WHOLE;
        whole.innerHTML = `<strong>全音符 ${q / QUARTERS_PER_WHOLE}</strong>`;
        wholeRow.appendChild(whole);
      }
      thead.appendChild(wholeRow);

      // 头部第 2 行：四分音符刻度
      const quarterRow = document.createElement("tr");
      for (let q = 0; q < QUARTER_COUNT; q++) {
        const quarter = document.createElement("th");
        quarter.className = "head-quarter";
        if (q % QUARTERS_PER_WHOLE === 0) {
          quarter.classList.add("whole-start");
        }
        quarter.title = `四分音符 ${q}`;
        quarterRow.appendChild(quarter);
      }
      thead.appendChild(quarterRow);

      // 主网格：MIDI 108 -> 21
      for (let midi = MIDI_MAX; midi >= MIDI_MIN; midi--) {
        const tr = document.createElement("tr");
        tr.className = "pitch-row";

        const midiCell = document.createElement("th");
        midiCell.className = "midi";
        midiCell.textContent = String(midi);
        tr.appendChild(midiCell);

        for (let q = 0; q < QUARTER_COUNT; q++) {
          const td = document.createElement("td");
          td.className = "cell";
          td.dataset.midi = String(midi);
          td.dataset.quarter = String(q);
          if (q % QUARTERS_PER_WHOLE === 0) {
            td.classList.add("whole-start");
          }
          tr.appendChild(td);
        }

        tbody.appendChild(tr);
      }

      table.appendChild(thead);
      table.appendChild(tbody);

      // 点击单元格创建固定大小音符
      tbody.addEventListener("click", (event) => {
        const cell = event.target.closest("td.cell");
        if (!cell) return;

        const note = document.createElement("div");
        note.className = "note";
        cell.appendChild(note);
      });
    </script>
  </body>
</html>
