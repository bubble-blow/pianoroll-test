<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Piano Roll</title>
    <style>
      :root {
        --bg: #0f1220;
        --panel: #161b2f;
        --line: #2a3255;
        --line-strong: #4f5ea0;
        --text: #e7ebff;
        --axis-bg: #13182a;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      body {
        display: flex;
        flex-direction: column;
      }

      .title {
        margin: 0;
        padding: 12px 16px;
        font-size: 16px;
        border-bottom: 1px solid var(--line);
        background: #0d1120;
      }

      #viewport {
        position: relative;
        flex: 1;
        overflow: auto;
        border-top: 1px solid var(--line);
      }

      #content {
        position: relative;
      }

      #corner,
      #xAxis,
      #yAxis {
        position: sticky;
        z-index: 30;
        background: var(--axis-bg);
      }

      #corner {
        left: 0;
        top: 0;
        border-right: 1px solid var(--line-strong);
        border-bottom: 1px solid var(--line-strong);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        color: #b6c0f8;
      }

      #xAxis {
        top: 0;
        left: var(--axis-left-width);
        border-bottom: 1px solid var(--line-strong);
        overflow: hidden;
      }

      #yAxis {
        top: var(--axis-top-height);
        left: 0;
        border-right: 1px solid var(--line-strong);
        overflow: hidden;
      }

      .x-label,
      .y-label {
        position: absolute;
        font-size: 11px;
        color: #c9d1ff;
        user-select: none;
        pointer-events: none;
      }

      .x-label {
        transform: translateX(2px);
        top: 2px;
      }

      .x-quarter {
        position: absolute;
        bottom: 0;
        width: 1px;
        background: var(--line);
        height: 8px;
      }

      .x-whole {
        background: var(--line-strong);
        height: 14px;
      }

      .y-label {
        right: 8px;
        transform: translateY(-50%);
      }

      #grid {
        position: absolute;
        background-color: var(--panel);
        cursor: crosshair;
        z-index: 1;
      }

      #notesLayer {
        position: absolute;
        z-index: 10;
        pointer-events: none;
      }

      .note {
        position: absolute;
        border-radius: 3px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: linear-gradient(
          to right,
          rgba(101, 196, 255, 0.95),
          rgba(101, 196, 255, 0.1)
        );
      }
    </style>
  </head>
  <body>
    <h1 class="title">Piano Roll（点击网格创建音符）</h1>
    <div id="viewport">
      <div id="content">
        <div id="corner">MIDI / 时值</div>
        <div id="xAxis"></div>
        <div id="yAxis"></div>
        <div id="grid"></div>
        <div id="notesLayer"></div>
      </div>
    </div>

    <script>
      const MIDI_MIN = 21;
      const MIDI_MAX = 108;
      const MIDI_COUNT = MIDI_MAX - MIDI_MIN + 1;

      const QUARTER_COUNT = 256;
      const QUARTERS_PER_WHOLE = 4;

      const AXIS_LEFT = 72;
      const AXIS_TOP = 34;
      const COL_WIDTH = 26;
      const ROW_HEIGHT = 22;
      const NOTE_WIDTH = 52;
      const NOTE_HEIGHT = 16;

      const content = document.getElementById("content");
      const corner = document.getElementById("corner");
      const xAxis = document.getElementById("xAxis");
      const yAxis = document.getElementById("yAxis");
      const grid = document.getElementById("grid");
      const notesLayer = document.getElementById("notesLayer");

      const gridWidth = QUARTER_COUNT * COL_WIDTH;
      const gridHeight = MIDI_COUNT * ROW_HEIGHT;

      const contentWidth = AXIS_LEFT + gridWidth;
      const contentHeight = AXIS_TOP + gridHeight;

      document.documentElement.style.setProperty("--axis-left-width", `${AXIS_LEFT}px`);
      document.documentElement.style.setProperty("--axis-top-height", `${AXIS_TOP}px`);

      content.style.width = `${contentWidth}px`;
      content.style.height = `${contentHeight}px`;

      corner.style.width = `${AXIS_LEFT}px`;
      corner.style.height = `${AXIS_TOP}px`;

      xAxis.style.width = `${gridWidth}px`;
      xAxis.style.height = `${AXIS_TOP}px`;

      yAxis.style.width = `${AXIS_LEFT}px`;
      yAxis.style.height = `${gridHeight}px`;

      grid.style.left = `${AXIS_LEFT}px`;
      grid.style.top = `${AXIS_TOP}px`;
      grid.style.width = `${gridWidth}px`;
      grid.style.height = `${gridHeight}px`;

      notesLayer.style.left = `${AXIS_LEFT}px`;
      notesLayer.style.top = `${AXIS_TOP}px`;
      notesLayer.style.width = `${gridWidth}px`;
      notesLayer.style.height = `${gridHeight}px`;

      grid.style.backgroundImage = [
        `repeating-linear-gradient(to right, transparent 0, transparent ${COL_WIDTH - 1}px, rgba(42, 50, 85, 1) ${COL_WIDTH - 1}px, rgba(42, 50, 85, 1) ${COL_WIDTH}px)`,
        `repeating-linear-gradient(to right, transparent 0, transparent ${COL_WIDTH * QUARTERS_PER_WHOLE - 1}px, rgba(79, 94, 160, 1) ${COL_WIDTH * QUARTERS_PER_WHOLE - 1}px, rgba(79, 94, 160, 1) ${COL_WIDTH * QUARTERS_PER_WHOLE}px)`,
        `repeating-linear-gradient(to bottom, transparent 0, transparent ${ROW_HEIGHT - 1}px, rgba(42, 50, 85, 1) ${ROW_HEIGHT - 1}px, rgba(42, 50, 85, 1) ${ROW_HEIGHT}px)`
      ].join(",");

      for (let q = 0; q <= QUARTER_COUNT; q++) {
        const tick = document.createElement("div");
        tick.className = `x-quarter ${q % QUARTERS_PER_WHOLE === 0 ? "x-whole" : ""}`;
        tick.style.left = `${q * COL_WIDTH}px`;
        xAxis.appendChild(tick);

        if (q % QUARTERS_PER_WHOLE === 0) {
          const label = document.createElement("div");
          label.className = "x-label";
          label.textContent = `全音符 ${q / QUARTERS_PER_WHOLE}`;
          label.style.left = `${q * COL_WIDTH + 2}px`;
          xAxis.appendChild(label);
        }
      }

      for (let i = 0; i < MIDI_COUNT; i++) {
        const midi = MIDI_MAX - i;
        const label = document.createElement("div");
        label.className = "y-label";
        label.textContent = String(midi);
        label.style.top = `${i * ROW_HEIGHT + ROW_HEIGHT / 2}px`;
        yAxis.appendChild(label);
      }

      grid.addEventListener("click", (event) => {
        const rect = grid.getBoundingClientRect();
        const localX = event.clientX - rect.left;
        const localY = event.clientY - rect.top;

        const quarterIndex = Math.floor(localX / COL_WIDTH);
        const rowIndex = Math.floor(localY / ROW_HEIGHT);

        if (quarterIndex < 0 || quarterIndex >= QUARTER_COUNT) return;
        if (rowIndex < 0 || rowIndex >= MIDI_COUNT) return;

        const note = document.createElement("div");
        note.className = "note";

        const left = quarterIndex * COL_WIDTH;
        const top = rowIndex * ROW_HEIGHT + (ROW_HEIGHT - NOTE_HEIGHT) / 2;

        note.style.left = `${left}px`;
        note.style.top = `${top}px`;
        note.style.width = `${NOTE_WIDTH}px`;
        note.style.height = `${NOTE_HEIGHT}px`;

        notesLayer.appendChild(note);
      });
    </script>
  </body>
</html>
